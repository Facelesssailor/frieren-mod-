plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = '1.0.0'
group = 'dev.facelesssailor.siebenkreis'

base {
    archivesName = 'siebenkreis-neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.200'
    mods {
        siebenkreis {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://code.redspace.io/releases' }
    maven { url = 'https://code.redspace.io/snapshots' }
    maven { url = 'https://maven.theillusivec4.top' }
}

dependencies {
    compileOnly('io.redspace:irons_spellbooks:1.21.1-3.16.3') { transitive = false }
    compileOnly('top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1') { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
