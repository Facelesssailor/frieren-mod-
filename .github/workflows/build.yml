name: Build Frieren Arcana

on:
  push:
    branches: [ 'rework/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log
        shell: bash
      - name: Publish to the rework-dist branch
        if: always()
        run: |
          mkdir -p /tmp/dist
          for f in build/libs/*.jar; do [ -f "$f" ] && cp "$f" "/tmp/dist/$(basename "$f" | sed -E 's/-([0-9]+)\.([0-9]+)\.([0-9]+)\.jar$/-\1_\2_\3.jar/')"; done
          cp build.log /tmp/dist/ 2>/dev/null || true
          # publish only our own outputs: never the game jars or caches Gradle leaves in the workspace
          rm -rf build .gradle run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan rework-dist
          git rm -rf --quiet .
          git clean -fdxq
          cp -r /tmp/dist/. .
          printf 'Built from %s\n' "$GITHUB_SHA" > BUILD.txt
          git add -A
          git commit -q -m "Build output for $GITHUB_SHA"
          git push -f origin rework-dist
